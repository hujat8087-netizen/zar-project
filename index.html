<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zarchinar Restaurant</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      background: #f6f5f2;
      color: #171717;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    main {
      width: min(460px, 100%);
      padding: 24px;
      border: 1px solid #dedbd3;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(24, 32, 47, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    p {
      margin: 0 0 12px;
      line-height: 1.5;
      color: #64748b;
    }

    code {
      display: inline-block;
      margin: 4px 0;
      padding: 2px 8px;
      border-radius: 6px;
      background: #faf7f0;
      color: #8a4b12;
      font-weight: 700;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      background: #b45309;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Zarchinar Restaurant</h1>
    <p id="status">Checking server...</p>
    <p><a id="openApp" href="http://127.0.0.1:3001/">Open app</a></p>
    <p style="font-size: 0.9rem">That computer: <code>npm start</code></p>
  </main>
  <script>
    const appUrl = 'http://127.0.0.1:3001/';
    const status = document.getElementById('status');
    const openApp = document.getElementById('openApp');

    async function goToServer() {
      try {
        const response = await fetch(appUrl + 'health', { cache: 'no-store' });
        if (!response.ok) throw new Error('offline');
        status.textContent = 'Server is running. Opening login page...';
        window.location.replace(appUrl);
      } catch (error) {
        status.textContent = 'Server is not running. Open terminal in this folder and run npm start, then click Open app.';
      }
    }

    openApp.addEventListener('click', (event) => {
      event.preventDefault();
      window.location.href = appUrl;
    });

    goToServer();
  </script>
</body>
</html>
